name: Build & Release Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar automaticamente na aba Releases?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Generate application icon
        shell: pwsh
        run: |
          python tools/make_icon.py

      - name: Build executable bundle with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean BattleVoiceMod.spec

      - name: Run bundle self-test
        shell: pwsh
        run: |
          & "dist\BattleVoiceMod\BattleVoiceMod.exe" --selftest

      - name: Determine version
        id: version_step
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ("${{ github.ref }}" -like "refs/tags/v*") {
              $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$ver"
          Write-Host "Detected version: $ver"

      - name: Build Setup Installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $candidates = @(
                  "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                  "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
              )
              foreach ($c in $candidates) {
                  if (Test-Path $c) { $iscc = $c; break }
              }
          }
          if (-not $iscc) {
              throw "ISCC.exe not found after Inno Setup installation!"
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc /DAppVersion="$env:APP_VERSION" installer\BattleVoiceMod.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleVoiceMod-Setup-${{ env.APP_VERSION }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Release v{0}', env.APP_VERSION) }}
          files: dist/installer/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
